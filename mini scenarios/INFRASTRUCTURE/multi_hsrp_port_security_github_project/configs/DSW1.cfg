! DSW1 — multilayer distribution switch
hostname DSW1
ip routing
spanning-tree mode rapid-pvst
!
vlan 10
 name USERS-VLAN10
vlan 20
 name USERS-VLAN20
vlan 30
 name USERS-VLAN30
vlan 40
 name USERS-VLAN40
vlan 999
 name NATIVE-UNUSED
!
interface GigabitEthernet1/0
 description ROUTED-TO-CSW1-Gi1/3
 no switchport
 ip address 10.0.11.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/1
 description ROUTED-TO-CSW2-Gi1/3
 no switchport
 ip address 10.0.21.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/2
 description TRUNK-TO-DSW2-Gi1/2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,999
 no shutdown
!
interface GigabitEthernet1/3
 description TRUNK-TO-ASW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,999
 no shutdown
!
interface GigabitEthernet1/4
 description TRUNK-TO-ASW2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,999
 no shutdown
!
interface Vlan10
 description HSRP-GATEWAY-VLAN10
 ip address 192.168.10.2 255.255.255.0
 standby version 2
 standby 10 ip 192.168.10.1
 standby 10 priority 120
 standby 10 preempt
 standby 10 track GigabitEthernet1/0 15
 standby 10 track GigabitEthernet1/1 15
 no shutdown
!
interface Vlan20
 description HSRP-GATEWAY-VLAN20
 ip address 192.168.20.2 255.255.255.0
 standby version 2
 standby 20 ip 192.168.20.1
 standby 20 priority 100
 standby 20 preempt
 no shutdown
!
interface Vlan30
 description HSRP-GATEWAY-VLAN30
 ip address 192.168.30.2 255.255.255.0
 standby version 2
 standby 30 ip 192.168.30.1
 standby 30 priority 120
 standby 30 preempt
 standby 30 track GigabitEthernet1/0 15
 standby 30 track GigabitEthernet1/1 15
 no shutdown
!
interface Vlan40
 description HSRP-GATEWAY-VLAN40
 ip address 192.168.40.2 255.255.255.0
 standby version 2
 standby 40 ip 192.168.40.1
 standby 40 priority 100
 standby 40 preempt
 no shutdown
!
spanning-tree vlan 10,30 root primary
spanning-tree vlan 20,40 root secondary
!
router ospf 10
 router-id 3.3.3.3
 passive-interface default
 no passive-interface GigabitEthernet1/0
 no passive-interface GigabitEthernet1/1
 network 10.0.0.0 0.0.255.255 area 0
 network 192.168.0.0 0.0.255.255 area 0
end
