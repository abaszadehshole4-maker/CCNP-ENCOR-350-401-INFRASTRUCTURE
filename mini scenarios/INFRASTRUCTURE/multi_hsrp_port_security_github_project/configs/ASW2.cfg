! ASW2 — Layer-2 access switch
hostname ASW2
no ip domain-lookup
spanning-tree mode rapid-pvst
!
vlan 10
 name USERS-VLAN10
vlan 20
 name USERS-VLAN20
vlan 30
 name USERS-VLAN30
vlan 40
 name USERS-VLAN40
vlan 999
 name NATIVE-UNUSED
!
interface GigabitEthernet0/1
 description TRUNK-TO-DSW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,999
 no shutdown
!
interface GigabitEthernet0/2
 description TRUNK-TO-DSW2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,999
 no shutdown
!
interface range GigabitEthernet0/3 - 4
 description HOST-PORTS-VLAN10
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range GigabitEthernet0/5 - 6
 description HOST-PORTS-VLAN20
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range GigabitEthernet0/7 - 8
 description HOST-PORTS-VLAN30
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range GigabitEthernet0/9 - 10
 description HOST-PORTS-VLAN40
 switchport mode access
 switchport access vlan 40
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
end
