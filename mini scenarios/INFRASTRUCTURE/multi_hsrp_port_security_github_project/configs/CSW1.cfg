! CSW1 — multilayer core switch
hostname CSW1
ip routing
spanning-tree mode rapid-pvst
!
interface GigabitEthernet1/0
 description TO-R1-G0/0
 no switchport
 ip address 10.0.1.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/1
 description TO-R2-G0/0
 no switchport
 ip address 10.0.3.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/2
 description L3-TO-CSW2-Gi1/2
 no switchport
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/3
 description L3-TO-DSW1-Gi1/0
 no switchport
 ip address 10.0.11.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/4
 description L3-TO-DSW2-Gi1/0
 no switchport
 ip address 10.0.12.1 255.255.255.252
 no shutdown
!
router ospf 10
 router-id 11.11.11.11
 passive-interface default
 no passive-interface GigabitEthernet1/0
 no passive-interface GigabitEthernet1/1
 no passive-interface GigabitEthernet1/2
 no passive-interface GigabitEthernet1/3
 no passive-interface GigabitEthernet1/4
 network 10.0.0.0 0.0.255.255 area 0
end
