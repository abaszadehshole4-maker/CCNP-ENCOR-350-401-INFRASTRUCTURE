! P1R1 — Area Border Router: Area 0 <-> Area 1
hostname P1R1
!
interface FastEthernet0/0
 description AREA0-BACKBONE-TO-P2R1
 ip address 10.100.100.1 255.255.255.0
 no shutdown
!
interface Serial0/0
 description AREA1-SERIAL-TO-P1R2
 ip address 192.168.1.33 255.255.255.240
 no shutdown
!
interface Loopback0
 description AREA1-LOOPBACK
 ip address 192.168.1.1 255.255.255.240
 ip ospf network point-to-point
!
router ospf 1
 router-id 1.1.1.1
 network 10.100.100.0 0.0.0.255 area 0
 network 192.168.1.32 0.0.0.15 area 1
 network 192.168.1.0 0.0.0.15 area 1
 area 1 range 192.168.1.0 255.255.255.192
!
end
