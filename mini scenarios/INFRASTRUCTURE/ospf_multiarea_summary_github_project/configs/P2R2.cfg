! P2R2 — Internal Area 2 router
hostname P2R2
!
interface Serial0/0
 description AREA2-SERIAL-TO-P2R1
 ip address 192.168.2.34 255.255.255.240
 no shutdown
!
interface FastEthernet0/0
 description AREA2-LAN-TO-P2R3-VIA-SWITCH
 ip address 192.168.2.49 255.255.255.240
 no shutdown
!
interface Loopback0
 description AREA2-LOOPBACK
 ip address 192.168.2.17 255.255.255.240
 ip ospf network point-to-point
!
router ospf 1
 router-id 5.5.5.5
 network 192.168.2.32 0.0.0.15 area 2
 network 192.168.2.48 0.0.0.15 area 2
 network 192.168.2.16 0.0.0.15 area 2
!
end
