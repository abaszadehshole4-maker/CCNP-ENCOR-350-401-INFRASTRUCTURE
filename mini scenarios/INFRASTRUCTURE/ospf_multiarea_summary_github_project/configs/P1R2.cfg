! P1R2 — Internal Area 1 router
hostname P1R2
!
interface Serial0/0
 description AREA1-SERIAL-TO-P1R1
 ip address 192.168.1.34 255.255.255.240
 no shutdown
!
interface FastEthernet0/0
 description AREA1-LAN-TO-P1R3-VIA-SWITCH
 ip address 192.168.1.49 255.255.255.240
 no shutdown
!
interface Loopback0
 description AREA1-LOOPBACK
 ip address 192.168.1.17 255.255.255.240
 ip ospf network point-to-point
!
router ospf 1
 router-id 2.2.2.2
 network 192.168.1.32 0.0.0.15 area 1
 network 192.168.1.48 0.0.0.15 area 1
 network 192.168.1.16 0.0.0.15 area 1
!
end
