! P2R1 — Area Border Router: Area 0 <-> Area 2
hostname P2R1
!
interface FastEthernet0/0
 description AREA0-BACKBONE-TO-P1R1
 ip address 10.100.100.2 255.255.255.0
 no shutdown
!
interface Serial0/0
 description AREA2-SERIAL-TO-P2R2
 ip address 192.168.2.33 255.255.255.240
 no shutdown
!
interface Loopback0
 description AREA2-LOOPBACK
 ip address 192.168.2.1 255.255.255.240
 ip ospf network point-to-point
!
router ospf 1
 router-id 4.4.4.4
 network 10.100.100.0 0.0.0.255 area 0
 network 192.168.2.32 0.0.0.15 area 2
 network 192.168.2.0 0.0.0.15 area 2
 area 2 range 192.168.2.0 255.255.255.192
!
end
