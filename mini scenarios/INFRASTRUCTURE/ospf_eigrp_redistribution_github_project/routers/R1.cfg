! R1 — EIGRP source router
! Lab interfaces: G0/0 to R2. Adapt interface IDs for your image.
hostname R1
!
interface GigabitEthernet0/0
 description TO-R2-EIGRP-AS100
 ip address 10.0.12.1 255.255.255.252
 no shutdown
!
interface Loopback10
 description EIGRP-PREFIX-TO-PERMIT-1
 ip address 10.10.10.1 255.255.255.0
!
interface Loopback20
 description EIGRP-PREFIX-TO-PERMIT-2
 ip address 10.10.20.1 255.255.255.0
!
interface Loopback99
 description EIGRP-PREFIX-TO-FILTER
 ip address 10.10.99.1 255.255.255.0
!
router eigrp 100
 eigrp router-id 1.1.1.1
 network 10.0.12.0 0.0.0.3
 network 10.10.10.0 0.0.0.255
 network 10.10.20.0 0.0.0.255
 network 10.10.99.0 0.0.0.255
 no auto-summary
!
end
