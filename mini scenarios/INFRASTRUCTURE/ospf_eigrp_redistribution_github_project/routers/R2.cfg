! R2 — redistribution boundary router
! G0/0 toward R1 uses EIGRP; G0/1 toward R3 uses OSPF.
hostname R2
!
interface GigabitEthernet0/0
 description TO-R1-EIGRP-AS100
 ip address 10.0.12.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description TO-R3-OSPF-AREA0
 ip address 10.0.23.2 255.255.255.252
 no shutdown
!
router eigrp 100
 eigrp router-id 2.2.2.2
 network 10.0.12.0 0.0.0.3
 no auto-summary
!
ip prefix-list EIGRP-TO-OSPF seq 5 permit 10.10.10.0/24
ip prefix-list EIGRP-TO-OSPF seq 10 permit 10.10.20.0/24
! 10.10.99.0/24 is deliberately not permitted. The prefix-list implicit deny filters it.
!
route-map EIGRP-TO-OSPF permit 10
 match ip address prefix-list EIGRP-TO-OSPF
!
router ospf 10
 router-id 2.2.2.2
 network 10.0.23.0 0.0.0.3 area 0
 redistribute eigrp 100 subnets route-map EIGRP-TO-OSPF
!
end
