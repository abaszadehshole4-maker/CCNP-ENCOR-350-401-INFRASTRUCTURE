! RouterC — AS 2 — eBGP to RouterB; iBGP to RouterD
hostname RouterC
!
interface GigabitEthernet0/0
 description P2P-TO-ROUTERB
 ip address 198.51.100.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description P2P-TO-ROUTERD
 ip address 203.0.113.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description LAN-C
 ip address 10.2.30.1 255.255.255.0
 no shutdown
!
interface Loopback0
 description BGP-PEERING-ID
 ip address 3.3.3.3 255.255.255.255
!
! Reach loopback peer addresses; BGP sessions source from Loopback0.
ip route 2.2.2.2 255.255.255.255 198.51.100.1
ip route 4.4.4.4 255.255.255.255 203.0.113.2
!
router bgp 2
 bgp log-neighbor-changes
 ! eBGP session to RouterB
 neighbor 2.2.2.2 remote-as 1
 neighbor 2.2.2.2 update-source Loopback0
 neighbor 2.2.2.2 ebgp-multihop 2
 ! iBGP session to RouterD; make RouterC the next hop for AS2 internal peer
 neighbor 4.4.4.4 remote-as 2
 neighbor 4.4.4.4 update-source Loopback0
 neighbor 4.4.4.4 next-hop-self
 network 3.3.3.3 mask 255.255.255.255
 network 10.2.30.0 mask 255.255.255.0
 network 198.51.100.0 mask 255.255.255.252
 network 203.0.113.0 mask 255.255.255.252
!
end
