! RouterA — AS 1 — iBGP to RouterB using loopbacks
hostname RouterA
!
interface GigabitEthernet0/0
 description P2P-TO-ROUTERB
 ip address 192.0.2.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAN-A
 ip address 10.1.10.1 255.255.255.0
 no shutdown
!
interface Loopback0
 description BGP-PEERING-ID
 ip address 1.1.1.1 255.255.255.255
!
interface Loopback99
 description WEIGHT-DEMO-PREFIX-INTENTIONALLY-OVERLAPPED-WITH-ROUTERD
 ip address 10.99.99.1 255.255.255.0
!
! Reach RouterB's BGP peer address through the directly connected link.
ip route 2.2.2.2 255.255.255.255 192.0.2.2
!
router bgp 1
 bgp log-neighbor-changes
 neighbor 2.2.2.2 remote-as 1
 neighbor 2.2.2.2 update-source Loopback0
 network 1.1.1.1 mask 255.255.255.255
 network 10.1.10.0 mask 255.255.255.0
 network 10.99.99.0 mask 255.255.255.0
 network 192.0.2.0 mask 255.255.255.252
!
end
