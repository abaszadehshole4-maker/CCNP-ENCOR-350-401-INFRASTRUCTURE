! RouterD — AS 2 — iBGP to RouterC using loopbacks
hostname RouterD
!
interface GigabitEthernet0/0
 description P2P-TO-ROUTERC
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAN-D
 ip address 10.2.40.1 255.255.255.0
 no shutdown
!
interface Loopback0
 description BGP-PEERING-ID
 ip address 4.4.4.4 255.255.255.255
!
interface Loopback99
 description WEIGHT-DEMO-PREFIX-INTENTIONALLY-OVERLAPPED-WITH-ROUTERA
 ip address 10.99.99.4 255.255.255.0
!
! Reach RouterC's BGP peer address through the directly connected link.
ip route 3.3.3.3 255.255.255.255 203.0.113.1
!
router bgp 2
 bgp log-neighbor-changes
 neighbor 3.3.3.3 remote-as 2
 neighbor 3.3.3.3 update-source Loopback0
 network 4.4.4.4 mask 255.255.255.255
 network 10.2.40.0 mask 255.255.255.0
 network 10.99.99.0 mask 255.255.255.0
 network 203.0.113.0 mask 255.255.255.252
!
end
