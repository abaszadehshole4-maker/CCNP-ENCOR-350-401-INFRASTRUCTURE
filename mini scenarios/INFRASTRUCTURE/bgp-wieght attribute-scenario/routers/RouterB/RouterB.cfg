! RouterB — AS 1 — iBGP to RouterA; eBGP to RouterC
hostname RouterB
!
interface GigabitEthernet0/0
 description P2P-TO-ROUTERA
 ip address 192.0.2.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description P2P-TO-ROUTERC
 ip address 198.51.100.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description LAN-B
 ip address 10.1.20.1 255.255.255.0
 no shutdown
!
interface Loopback0
 description BGP-PEERING-ID
 ip address 2.2.2.2 255.255.255.255
!
! Reach loopback peer addresses; BGP sessions source from Loopback0.
ip route 1.1.1.1 255.255.255.255 192.0.2.1
ip route 3.3.3.3 255.255.255.255 198.51.100.2
!
! Prefix-specific Weight policy: prefer the duplicate demo prefix from RouterC.
ip prefix-list WEIGHT-DEMO seq 5 permit 10.99.99.0/24
!
route-map PREFER-AS2-IN permit 10
 match ip address prefix-list WEIGHT-DEMO
 set weight 500
route-map PREFER-AS2-IN permit 20
 ! Permit all other prefixes without changing their attributes.
!
router bgp 1
 bgp log-neighbor-changes
 ! iBGP session to RouterA, using loopback addresses
 neighbor 1.1.1.1 remote-as 1
 neighbor 1.1.1.1 update-source Loopback0
 neighbor 1.1.1.1 next-hop-self
 ! eBGP session to RouterC, using loopback addresses
 neighbor 3.3.3.3 remote-as 2
 neighbor 3.3.3.3 update-source Loopback0
 neighbor 3.3.3.3 ebgp-multihop 2
 neighbor 3.3.3.3 route-map PREFER-AS2-IN in
 network 2.2.2.2 mask 255.255.255.255
 network 10.1.20.0 mask 255.255.255.0
 network 192.0.2.0 mask 255.255.255.252
 network 198.51.100.0 mask 255.255.255.252
!
end
