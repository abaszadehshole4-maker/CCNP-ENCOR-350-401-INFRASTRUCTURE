! SW2 — MST region member; root for MST instance 2
hostname SW2
!
vlan 10
 name USERS_A
vlan 20
 name USERS_B
vlan 30
 name VOICE_A
vlan 40
 name VOICE_B
!
spanning-tree mode mst
spanning-tree mst configuration
 name CAMPUS-MST
 revision 1
 instance 1 vlan 10,20
 instance 2 vlan 30,40
 exit
!
! Secondary root for instance 1; preferred root for instance 2
spanning-tree mst 1 priority 8192
spanning-tree mst 2 priority 4096
!
interface GigabitEthernet0/0
 description TRUNK-to-SW1-Gi0/0
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 no shutdown
!
interface GigabitEthernet0/1
 description TRUNK-to-SW3-Gi0/0
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 no shutdown
!
interface GigabitEthernet0/2
 description ACCESS-HOST-VLAN20
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/3
 description ACCESS-HOST-VLAN40
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no shutdown
!
end
