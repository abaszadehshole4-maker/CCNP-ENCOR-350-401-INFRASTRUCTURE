! SW3 — MST region member; transit switch in the triangle
hostname SW3
!
vlan 10
 name USERS_A
vlan 20
 name USERS_B
vlan 30
 name VOICE_A
vlan 40
 name VOICE_B
!
spanning-tree mode mst
spanning-tree mst configuration
 name CAMPUS-MST
 revision 1
 instance 1 vlan 10,20
 instance 2 vlan 30,40
 exit
!
! Not intended to be root for either instance
spanning-tree mst 1 priority 12288
spanning-tree mst 2 priority 12288
!
interface GigabitEthernet0/0
 description TRUNK-to-SW2-Gi0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 no shutdown
!
interface GigabitEthernet0/1
 description TRUNK-to-SW1-Gi0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 no shutdown
!
interface GigabitEthernet0/2
 description ACCESS-HOST-VLAN10
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/3
 description ACCESS-HOST-VLAN40
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no shutdown
!
end
