! GLBP Lab - R3
! Upstream/ISP simulator used only to test end-to-end reachability.
! Loopback0 represents an external destination: 203.0.113.1/32.
!
hostname R3
no ip domain-lookup
!
interface GigabitEthernet0/0
 description LINK_to_R1_G0/1
 ip address 10.0.12.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LINK_to_R2_G0/1
 ip address 10.0.23.2 255.255.255.252
 no shutdown
!
interface Loopback0
 description SIMULATED_EXTERNAL_TEST_DESTINATION
 ip address 203.0.113.1 255.255.255.255
!
! Install equal-cost routes via R1 and R2 for the users LAN.
! If a router is fully powered off and its WAN link goes down, its next hop is removed.
ip route 192.168.10.0 255.255.255.0 10.0.12.1
ip route 192.168.10.0 255.255.255.0 10.0.23.1
!
end
