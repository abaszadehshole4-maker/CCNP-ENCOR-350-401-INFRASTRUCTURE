! GLBP Lab - R2
! Role: second GLBP member; can become AVG if R1 fails and can be an AVF.
! LAN physical IP: 192.168.10.3/24
! GLBP virtual default gateway: 192.168.10.1, group 10
! Adjust interface names if your IOS image uses different numbering.
!
hostname R2
no ip domain-lookup
!
interface GigabitEthernet0/0
 description USER_LAN_to_SW1
 ip address 192.168.10.3 255.255.255.0
 glbp 10 priority 100
 glbp 10 preempt
 glbp 10 load-balancing round-robin
 glbp 10 ip 192.168.10.1
 no shutdown
!
interface GigabitEthernet0/1
 description WAN_to_R3_G0/1
 ip address 10.0.23.1 255.255.255.252
 no shutdown
!
ip route 203.0.113.1 255.255.255.255 10.0.23.2
!
end
