# FortiGate-EDGE - FortiOS 7.6.7
# Keep port1 reserved for EVE-NG / management access.
# port2 = simulated ISP; port3 = internal transit to Cisco CORE-R1.
# Confirm your VM interface names before applying.

config system interface
    edit "port2"
        set alias "WAN-TO-ISP-R2"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping
        set role wan
    next
    edit "port3"
        set alias "TRANSIT-TO-CORE-R1"
        set ip 10.255.0.1 255.255.255.252
        set allowaccess ping
        set role lan
    next
end

# Objects used by the test policy. The ISP address is a documentation-only loopback.
config firewall address
    edit "LAN10-USERS"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "LAN20-SERVERS"
        set subnet 10.10.20.0 255.255.255.0
    next
    edit "ISP-TEST-LO0"
        set subnet 203.0.113.1 255.255.255.255
    next
end

# Lab-only transit policy. NAT is intentionally disabled so return routing is tested.
config firewall policy
    edit 1
        set name "LAB-LANS-TO-ISP-TEST"
        set srcintf "port3"
        set dstintf "port2"
        set srcaddr "LAN10-USERS" "LAN20-SERVERS"
        set dstaddr "ISP-TEST-LO0"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat disable
    next
end

# OSPF: internal routing with Cisco CORE-R1 in Area 0.
# Point-to-point network type avoids DR/BDR election on this two-router link.
config router ospf
    set router-id 10.255.0.1
    set default-information-originate enable
    config area
        edit 0.0.0.0
        next
    end
    config network
        edit 1
            set prefix 10.255.0.0 255.255.255.252
            set area 0.0.0.0
        next
    end
    config ospf-interface
        edit "TO-CORE-R1"
            set interface "port3"
            set network-type point-to-point
            set hello-interval 10
            set dead-interval 40
        next
    end
end

# eBGP: FortiGate AS 65010 peers directly with ISP AS 65000.
# The network statements are originated only when matching routes exist in the RIB.
# Those /24 routes are learned from OSPF above.
config router bgp
    set as 65010
    set router-id 198.51.100.2
    config neighbor
        edit "198.51.100.1"
            set remote-as 65000
            set soft-reconfiguration enable
        next
    end
    config network
        edit 1
            set prefix 10.10.10.0 255.255.255.0
        next
        edit 2
            set prefix 10.10.20.0 255.255.255.0
        next
    end
end

