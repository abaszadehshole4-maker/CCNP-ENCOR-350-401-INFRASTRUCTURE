! R2-ISP-B - Cisco IOSv
hostname R2-ISP-B
no ip domain-lookup
!
interface GigabitEthernet0/0
 description TO-FGT-HQ-port3-WAN2
 ip address 198.51.100.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description TO-R3-CORE-GigabitEthernet0/1
 ip address 10.0.2.1 255.255.255.252
 no shutdown
!
! Route remote test servers toward the Core router.
ip route 192.0.2.0 255.255.255.0 10.0.2.2
!
end
