# FortiGate HQ - FortiOS 7.6.x
# Port mapping: port1=LAN, port2=WAN1/ISP-A, port3=WAN2/ISP-B
# Lab assumes a clean, single-VDOM configuration. Review interface names before paste.

config system global
    set hostname FGT-HQ-PBR
end

config system interface
    edit "port1"
        set alias "LAN"
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping https ssh
        set status up
    next
    edit "port2"
        set alias "WAN1-ISP-A-DEFAULT"
        set ip 203.0.113.2 255.255.255.252
        set allowaccess ping
        set status up
    next
    edit "port3"
        set alias "WAN2-ISP-B-PBR"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping
        set status up
    next
end

# Baseline route: ordinary traffic uses ISP-A (WAN1).
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 203.0.113.1
        set device "port2"
        set distance 10
    next
end

# Address objects used by the firewall policies.
config firewall address
    edit "PC-PBR"
        set subnet 10.10.10.10 255.255.255.255
    next
    edit "TEST-SERVER-A"
        set subnet 192.0.2.10 255.255.255.255
    next
end

# PBR policy: only PC-PBR -> TEST-SERVER-A is sent through ISP-B/WAN2.
# The next-hop 198.51.100.1 is directly connected through port3.
config router policy
    edit 10
        set input-device "port1"
        set src "10.10.10.10/255.255.255.255"
        set dst "192.0.2.10/255.255.255.255"
        set action permit
        set gateway 198.51.100.1
        set output-device "port3"
        set status enable
        set comments "PC-PBR to Server-A via ISP-B"
    next
end

# Lab policies: NAT keeps the return path tied to the selected WAN interface.
# ALL service is for this isolated ping/traceroute lab only; narrow it in production.
config firewall policy
    edit 10
        set name "LAN_to_WAN2_PBR_PC1_ServerA"
        set srcintf "port1"
        set dstintf "port3"
        set srcaddr "PC-PBR"
        set dstaddr "TEST-SERVER-A"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
    edit 20
        set name "LAN_to_WAN1_Default"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
end

# Useful checks
# get system interface physical
# get router info routing-table all
# show router policy
# diagnose firewall proute list
