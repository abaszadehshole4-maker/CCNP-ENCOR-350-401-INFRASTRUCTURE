! SW-LAN - Cisco IOSvL2
hostname SW-LAN
no ip domain-lookup
!
vlan 10
 name USERS
!
interface GigabitEthernet0/1
 description TO-FGT-HQ-port1-LAN
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/2
 description TO-PC-PBR
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/3
 description TO-PC-DEFAULT
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
end
