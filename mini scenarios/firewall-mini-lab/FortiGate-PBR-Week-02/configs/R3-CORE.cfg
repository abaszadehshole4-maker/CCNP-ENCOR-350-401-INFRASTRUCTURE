! R3-CORE - Cisco IOSv
hostname R3-CORE
no ip domain-lookup
!
interface GigabitEthernet0/0
 description TO-R1-ISP-A-GigabitEthernet0/1
 ip address 10.0.1.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description TO-R2-ISP-B-GigabitEthernet0/1
 ip address 10.0.2.2 255.255.255.252
 no shutdown
!
interface Loopback0
 description TEST-SERVER-A-PBR-DESTINATION
 ip address 192.0.2.10 255.255.255.255
!
interface Loopback1
 description TEST-SERVER-B-NONMATCHING-DESTINATION
 ip address 192.0.2.20 255.255.255.255
!
! Return routes for FortiGate's interface-NAT addresses.
ip route 203.0.113.2 255.255.255.255 10.0.1.1
ip route 198.51.100.2 255.255.255.255 10.0.2.1
!
end
