! R1-ISP-A - Cisco IOSv
hostname R1-ISP-A
no ip domain-lookup
!
interface GigabitEthernet0/0
 description TO-FGT-HQ-port2-WAN1
 ip address 203.0.113.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description TO-R3-CORE-GigabitEthernet0/0
 ip address 10.0.1.1 255.255.255.252
 no shutdown
!
! Route remote test servers toward the Core router.
ip route 192.0.2.0 255.255.255.0 10.0.1.2
!
end
