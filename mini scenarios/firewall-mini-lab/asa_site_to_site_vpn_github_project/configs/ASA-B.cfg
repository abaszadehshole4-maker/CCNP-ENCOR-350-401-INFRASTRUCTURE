! ASA-B — Site-to-site IPsec VPN using IKEv2
! Example for a lab. Check hardware/software/crypto license before applying.
!
hostname ASA-B
!
interface Ethernet0
 nameif outside
 security-level 0
 ip address 203.0.113.1 255.255.255.252
 no shutdown
!
interface Ethernet1
 nameif inside
 security-level 100
 ip address 10.20.20.1 255.255.255.0
 no shutdown
!
! IKEv2 Phase 1 proposal/policy — must be compatible with ASA-A
crypto ikev2 policy 10
 encryption aes-256
 integrity sha256
 group 14
 prf sha256
 lifetime seconds 86400
!
crypto ikev2 enable outside
!
! IPsec Phase 2 proposal — must match ASA-A
crypto ipsec ikev2 ipsec-proposal S2S-PROPOSAL
 protocol esp encryption aes-256
 protocol esp integrity sha-1
!
! Mirror image of ASA-A's interesting-traffic ACL
access-list S2S-TRAFFIC extended permit ip 10.20.20.0 255.255.255.0 10.10.10.0 255.255.255.0
!
! Remote peer and matching pre-shared-key authentication
 tunnel-group 203.0.113.2 type ipsec-l2l
 tunnel-group 203.0.113.2 ipsec-attributes
  ikev2 local-authentication pre-shared-key LabOnly-ChangeThisKey-2026
  ikev2 remote-authentication pre-shared-key LabOnly-ChangeThisKey-2026
!
crypto map S2S-MAP 10 match address S2S-TRAFFIC
crypto map S2S-MAP 10 set peer 203.0.113.2
crypto map S2S-MAP 10 set ikev2 ipsec-proposal S2S-PROPOSAL
crypto map S2S-MAP interface outside
!
end
