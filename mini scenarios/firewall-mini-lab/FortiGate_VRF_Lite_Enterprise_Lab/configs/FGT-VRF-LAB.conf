# FortiGate 7.6.x - VRF separation lab
# Apply from console on a fresh lab VM. Adapt interface names if your VM image differs.
# Enable System > Feature Visibility > Advanced Routing before configuring VRFs.

config system interface
    edit "port2"
        set alias "WAN-USERS-VRF10"
        set ip 203.0.113.2 255.255.255.252
        set allowaccess ping
        set role wan
        set vrf 10
    next
    edit "port3"
        set alias "LAN-8021Q-TRUNK"
        set role lan
    next
    edit "port4"
        set alias "WAN-APPS-VRF20"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping
        set role wan
        set vrf 20
    next
    edit "VLAN10-USERS"
        set interface "port3"
        set vlanid 10
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping
        set role lan
        set vrf 10
    next
    edit "VLAN20-APPS"
        set interface "port3"
        set vlanid 20
        set ip 10.20.20.1 255.255.255.0
        set allowaccess ping
        set role lan
        set vrf 20
    next
end

config router static
    edit 10
        set dst 0.0.0.0 0.0.0.0
        set gateway 203.0.113.1
        set device "port2"
        set distance 10
        set vrf 10
        set comment "VRF10 USERS default route to ISP"
    next
    edit 20
        set dst 0.0.0.0 0.0.0.0
        set gateway 198.51.100.1
        set device "port4"
        set distance 10
        set vrf 20
        set comment "VRF20 APPS default route to ISP"
    next
    edit 110
        set dst 10.20.20.0 255.255.255.0
        set blackhole enable
        set distance 10
        set vrf 10
        set comment "Block APPS subnet from USERS VRF"
    next
    edit 120
        set dst 10.10.10.0 255.255.255.0
        set blackhole enable
        set distance 10
        set vrf 20
        set comment "Block USERS subnet from APPS VRF"
    next
end

config firewall address
    edit "NET-USERS-VRF10"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "NET-APPS-VRF20"
        set subnet 10.20.20.0 255.255.255.0
    next
end

# Policy NAT is used in this lab. On a fresh FortiGate, central NAT is normally
# disabled. Verify with: show system settings
config firewall policy
    edit 10
        set name "USERS-VRF10-TO-ISP"
        set srcintf "VLAN10-USERS"
        set dstintf "port2"
        set action accept
        set srcaddr "NET-USERS-VRF10"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
    edit 20
        set name "APPS-VRF20-TO-ISP"
        set srcintf "VLAN20-APPS"
        set dstintf "port4"
        set action accept
        set srcaddr "NET-APPS-VRF20"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
end

# After assigning VRFs, run `execute router restart` from the console if your build
# requires routing-table reconstruction (Fortinet uses this in its VRF example).
# Verification commands (run individually at the FortiGate prompt):
# get system status
# show system interface
# show router static
# get router info routing-table all
# get router info routing-table static
# show firewall policy
# diagnose ip route list
