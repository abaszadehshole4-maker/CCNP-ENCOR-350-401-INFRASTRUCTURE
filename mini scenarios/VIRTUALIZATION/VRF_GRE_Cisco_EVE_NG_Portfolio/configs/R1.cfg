!
! VRF + GRE Portfolio Lab
! Router: R1
! Creator: Sholeh Abaszadeh
!
hostname R1
!
vrf definition CUSTOMER
 rd 65000:100
!
interface GigabitEthernet0/0
 description CUSTOMER-LAN-A
 vrf forwarding CUSTOMER
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description UNDERLAY-TO-R2
 ip address 10.0.12.1 255.255.255.252
 no shutdown
!
interface Tunnel0
 description GRE-OVER-UNDERLAY-TO-R2
 vrf forwarding CUSTOMER
 ip address 172.16.12.1 255.255.255.252
 tunnel source GigabitEthernet0/1
 tunnel destination 10.0.12.2
 tunnel mode gre ip
 no shutdown
!
ip route vrf CUSTOMER 192.168.20.0 255.255.255.0 172.16.12.2
!
end
