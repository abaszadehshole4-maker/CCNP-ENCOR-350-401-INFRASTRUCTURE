hostname SW-B
!
no ip domain-lookup
vlan 20
 name CUSTOMER-BETA
!
interface GigabitEthernet0/0
 description TO-CE-B
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface GigabitEthernet0/1
 description TO-PC-B
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!
interface Vlan20
 ip address 192.168.20.2 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.20.1
!
end
