hostname SW-A
!
no ip domain-lookup
vlan 10
 name CUSTOMER-ALPHA
!
interface GigabitEthernet0/0
 description TO-CE-A
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface GigabitEthernet0/1
 description TO-PC-A
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface Vlan10
 ip address 192.168.10.2 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.10.1
!
end
