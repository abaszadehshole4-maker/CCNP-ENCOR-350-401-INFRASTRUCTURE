hostname CE-A
!
no ip domain-lookup
!
interface GigabitEthernet0/0
 description TO-PE-SW-BLUE
 ip address 172.31.100.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description CUSTOMER-ALPHA-LAN
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
interface Loopback0
 description ALPHA-ROUTE
 ip address 192.0.2.10 255.255.255.255
!
router bgp 65101
 bgp router-id 192.0.2.10
 neighbor 172.31.100.1 remote-as 65000
 network 192.0.2.10 mask 255.255.255.255
 network 192.168.10.0 mask 255.255.255.0
!
end
