hostname PE-SW
!
no ip domain-lookup
ip routing
!
ip vrf BLUE
 rd 65000:101
!
ip vrf GREEN
 rd 65000:102
!
interface Loopback100
 description GLOBAL-ROUTER-ID
 ip address 10.255.100.1 255.255.255.255
!
interface GigabitEthernet1/0/1
 description CE-A-BLUE
 no switchport
 ip vrf forwarding BLUE
 ip address 172.31.100.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0/2
 description CE-B-GREEN
 no switchport
 ip vrf forwarding GREEN
 ip address 172.31.200.1 255.255.255.252
 no shutdown
!
router bgp 65000
 bgp router-id 10.255.100.1
 address-family ipv4 vrf BLUE
  neighbor 172.31.100.2 remote-as 65101
  neighbor 172.31.100.2 activate
 exit-address-family
 address-family ipv4 vrf GREEN
  neighbor 172.31.200.2 remote-as 65102
  neighbor 172.31.200.2 activate
 exit-address-family
!
end
