hostname CE-B
!
no ip domain-lookup
!
interface GigabitEthernet0/0
 description TO-PE-SW-GREEN
 ip address 172.31.200.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description CUSTOMER-BETA-LAN
 ip address 192.168.20.1 255.255.255.0
 no shutdown
!
interface Loopback0
 description BETA-ROUTE
 ip address 192.0.2.20 255.255.255.255
!
router bgp 65102
 bgp router-id 192.0.2.20
 neighbor 172.31.200.1 remote-as 65000
 network 192.0.2.20 mask 255.255.255.255
 network 192.168.20.0 mask 255.255.255.0
!
end
