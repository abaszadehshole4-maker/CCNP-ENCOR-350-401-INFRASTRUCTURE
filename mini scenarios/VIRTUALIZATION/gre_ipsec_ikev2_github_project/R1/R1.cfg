! GRE over IPsec using IKEv2 — R1
! Example config for supported Cisco IOS/IOS XE images. Verify syntax with your image.
!
hostname R1
!
interface GigabitEthernet0/0
 description UNDERLAY-TO-R2
 ip address 203.0.113.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAN-1
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
crypto ikev2 proposal IKEV2-PROP
 encryption aes-cbc-256
 integrity sha256
 group 14
!
crypto ikev2 policy IKEV2-POLICY
 proposal IKEV2-PROP
!
crypto ikev2 keyring IKEV2-KEYRING
 peer R2
  address 203.0.113.2
  pre-shared-key local LabOnly-ChangeThisKey-2026
  pre-shared-key remote LabOnly-ChangeThisKey-2026
!
crypto ikev2 profile IKEV2-PROFILE
 match identity remote address 203.0.113.2 255.255.255.255
 authentication local pre-share
 authentication remote pre-share
 keyring local IKEV2-KEYRING
!
crypto ipsec transform-set GRE-TS esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile GRE-IPSEC-PROFILE
 set transform-set GRE-TS
 set ikev2-profile IKEV2-PROFILE
!
interface Tunnel0
 description GRE-OVER-IPSEC-TO-R2
 ip address 10.10.10.1 255.255.255.252
 ip mtu 1400
 tunnel source GigabitEthernet0/0
 tunnel destination 203.0.113.2
 tunnel mode gre ip
 tunnel protection ipsec profile GRE-IPSEC-PROFILE
 no shutdown
!
router ospf 10
 router-id 1.1.1.1
 passive-interface GigabitEthernet0/1
 network 10.10.10.0 0.0.0.3 area 0
 network 192.168.10.0 0.0.0.255 area 0
!
end
