hostname CORE
!
no ip domain-lookup
ip routing
ipv6 unicast-routing
!
interface e0/0
 description TO-EDGE
 no switchport
 ip address 10.255.0.2 255.255.255.252
 ipv6 address 2001:db8:10:ff00::2/64
 no shutdown
!
interface e0/1
 description TO-DIST1
 no switchport
 ip address 10.255.0.5 255.255.255.252
 ipv6 address 2001:db8:10:ff01::1/64
 no shutdown
!
interface e0/2
 description TO-DIST2
 no switchport
 ip address 10.255.0.9 255.255.255.252
 ipv6 address 2001:db8:10:ff02::1/64
 no shutdown
!
interface loopback0
 ip address 10.255.255.2 255.255.255.255
 ipv6 address 2001:db8:0:2::1/128
!
router ospf 10
 router-id 10.255.255.2
 network 10.255.0.0 0.0.0.255 area 0
 network 10.255.255.2 0.0.0.0 area 0
 passive-interface default
 no passive-interface e0/0
 no passive-interface e0/1
 no passive-interface e0/2
!
router ospfv3 20
 address-family ipv6 unicast
  router-id 10.255.255.2
 exit-address-family
!
interface e0/0
 ospfv3 20 ipv6 area 0
interface e0/1
 ospfv3 20 ipv6 area 0
interface e0/2
 ospfv3 20 ipv6 area 0
interface loopback0
 ospfv3 20 ipv6 area 0
!
logging host 10.110.30.50
logging trap warnings
ntp server 10.110.30.50
!
ip radius source-interface loopback0
radius server MGMT1
 address ipv4 10.110.30.50 auth-port 1812 acct-port 1813
 key LabRadius!2026
!
aaa new-model
aaa group server radius MGMT-RADIUS
 server name MGMT1
aaa authentication login default group MGMT-RADIUS local
username localadmin privilege 15 secret PortfolioLocal!2026
!
ip access-list standard MGMT-NMS
 permit 10.110.30.50
 deny any
snmp-server community NARGES-RO ro MGMT-NMS
snmp-server contact NARGES
snmp-server location EVE-NG-PORTFOLIO-LAB
snmp-server host 10.110.30.50 version 2c NARGES-RO config ospf bgp
snmp-server enable traps config
snmp-server enable traps ospf
!
end
