hostname ISP
!
no ip domain-lookup
ipv6 unicast-routing
!
interface e0/0
 description TO-EDGE
 ip address 203.0.113.1 255.255.255.252
 ipv6 address 2001:db8:203:1::1/64
 no shutdown
!
interface loopback0
 description ISP-ROUTER-ID-AND-TEST-DESTINATION
 ip address 198.18.0.1 255.255.255.255
 ipv6 address 2001:db8:ffff::1/128
!
ip route 0.0.0.0 0.0.0.0 Null0
ipv6 route ::/0 Null0
!
router bgp 64530
 bgp router-id 198.18.0.1
 neighbor 203.0.113.2 remote-as 64540
 !
 address-family ipv4
  neighbor 203.0.113.2 activate
  network 198.18.0.1 mask 255.255.255.255
  network 0.0.0.0
 exit-address-family
 !
 address-family ipv6
  neighbor 2001:db8:203:1::2 remote-as 64540
  neighbor 2001:db8:203:1::2 activate
  network 2001:db8:ffff::1/128
  network ::/0
 exit-address-family
!
ntp master 3
!
! Optional test routes if you want the ISP itself to carry extra prefixes.
! ip route 192.0.2.0 255.255.255.0 Null0
! ip route 198.51.100.0 255.255.255.0 Null0
!
end
