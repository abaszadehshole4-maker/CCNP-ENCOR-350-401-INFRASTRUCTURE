hostname EDGE
!
no ip domain-lookup
ip cef
ipv6 unicast-routing
!
interface e0/0
 description TO-ISP
 ip address 203.0.113.2 255.255.255.252
 ipv6 address 2001:db8:203:1::2/64
 no shutdown
!
interface e0/1
 description TO-CORE
 ip address 10.255.0.1 255.255.255.252
 ipv6 address 2001:db8:10:ff00::1/64
 no shutdown
!
interface loopback0
 description EDGE-ROUTER-ID
 ip address 10.255.255.1 255.255.255.255
 ipv6 address 2001:db8:0:1::1/128
!
ip prefix-list EDGE-EXPORT seq 5 permit 10.255.255.1/32
!
router ospf 10
 router-id 10.255.255.1
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.255.1 0.0.0.0 area 0
 passive-interface default
 no passive-interface e0/1
 default-information originate
!
router ospfv3 20
 address-family ipv6 unicast
  router-id 10.255.255.1
  area 0 range 2001:db8:0::/48
  default-information originate
 exit-address-family
!
interface e0/1
 ospfv3 20 ipv6 area 0
!
interface loopback0
 ospfv3 20 ipv6 area 0
!
router bgp 64540
 bgp router-id 10.255.255.1
 neighbor 203.0.113.1 remote-as 64530
 !
 address-family ipv4
  neighbor 203.0.113.1 activate
  network 10.255.255.1 mask 255.255.255.255
 exit-address-family
 !
 address-family ipv6
  neighbor 2001:db8:203:1::1 remote-as 64530
  neighbor 2001:db8:203:1::1 activate
  network 2001:db8:0:1::1/128
 exit-address-family
!
! Route-filtering challenge: redistribute only 192.0.2.0/24.
ip route 192.0.2.0 255.255.255.0 Null0
ip route 198.51.100.0 255.255.255.0 Null0
!
ip prefix-list REDIST-STATIC seq 5 permit 192.0.2.0/24
route-map REDIST-STATIC permit 10
 match ip address prefix-list REDIST-STATIC
!
router ospf 10
 redistribute static subnets route-map REDIST-STATIC
!
! Optional management-plane examples.
ip radius source-interface loopback0
radius server MGMT1
 address ipv4 10.110.30.50 auth-port 1812 acct-port 1813
 key LabRadius!2026
!
aaa new-model
aaa group server radius MGMT-RADIUS
 server name MGMT1
!
aaa authentication login default group MGMT-RADIUS local
username localadmin privilege 15 secret PortfolioLocal!2026
!
ip access-list standard MGMT-NMS
 permit 10.110.30.50
 deny any
snmp-server community NARGES-RO ro MGMT-NMS
snmp-server contact NARGES
snmp-server location EVE-NG-PORTFOLIO-LAB
snmp-server host 10.110.30.50 version 2c NARGES-RO config ospf bgp
snmp-server enable traps config
snmp-server enable traps ospf
snmp-server enable traps bgp
!
logging host 10.110.30.50
logging trap warnings
!
ntp server 10.110.30.50
!
! Flexible NetFlow / NetFlow v9 exporter
flow exporter MGMT-NF
 destination 10.110.30.50
 transport udp 9999
 export-protocol netflow-v9
 template data timeout 60
!
flow record EDGE-TRAFFIC
 match ipv4 source address
 match ipv4 destination address
 match ipv4 protocol
 match transport source-port
 match transport destination-port
 collect counter bytes long
 collect counter packets long
 collect timestamp sys-uptime first
 collect timestamp sys-uptime last
!
flow monitor EDGE-MONITOR
 exporter MGMT-NF
 record EDGE-TRAFFIC
!
interface e0/1
 ip flow monitor EDGE-MONITOR input
 ip flow monitor EDGE-MONITOR output
!
end
