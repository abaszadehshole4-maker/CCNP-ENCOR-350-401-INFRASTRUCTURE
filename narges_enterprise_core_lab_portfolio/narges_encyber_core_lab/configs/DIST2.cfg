hostname DIST2
!
no ip domain-lookup
ip routing
ipv6 unicast-routing
!
vlan 110
 name USERS_A
vlan 120
 name USERS_B
vlan 130
 name SERVERS
vlan 999
 name NATIVE
!
interface e0/0
 description TO-CORE
 no switchport
 ip address 10.255.0.10 255.255.255.252
 ipv6 address 2001:db8:10:ff02::2/64
 no shutdown
!
interface e0/1
 description TO-DIST1
 no switchport
 ip address 10.255.0.14 255.255.255.252
 ipv6 address 2001:db8:10:ff03::2/64
 no shutdown
!
interface e1/0
 description TRUNK-TO-ACC2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 110,120,130,999
 no shutdown
!
interface e1/1
 description TRUNK-TO-ACC1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 110,120,130,999
 no shutdown
!
interface vlan 110
 ip address 10.110.10.2 255.255.255.0
 standby version 2
 standby 110 ip 10.110.10.254
 standby 110 priority 100
 standby 110 preempt
 standby 110 track 12 decrement 60
 ipv6 address 2001:db8:110:110::2/64
 no shutdown
!
interface vlan 120
 ip address 10.110.20.2 255.255.255.0
 standby version 2
 standby 120 ip 10.110.20.254
 standby 120 priority 150
 standby 120 preempt
 standby 120 track 12 decrement 60
 ipv6 address 2001:db8:110:120::2/64
 no shutdown
!
interface vlan 130
 ip address 10.110.30.2 255.255.255.0
 standby version 2
 standby 130 ip 10.110.30.254
 standby 130 priority 100
 standby 130 preempt
 standby 130 track 12 decrement 60
 ipv6 address 2001:db8:110:130::2/64
 no shutdown
!
interface loopback0
 ip address 10.255.255.4 255.255.255.255
 ipv6 address 2001:db8:0:4::1/128
!
router ospf 10
 router-id 10.255.255.4
 network 10.255.0.8 0.0.0.3 area 0
 network 10.255.0.12 0.0.0.3 area 0
 network 10.110.10.0 0.0.0.255 area 0
 network 10.110.20.0 0.0.0.255 area 0
 network 10.110.30.0 0.0.0.255 area 0
 network 10.255.255.4 0.0.0.0 area 0
 passive-interface default
 no passive-interface e0/0
 no passive-interface e0/1
!
router ospfv3 20
 address-family ipv6 unicast
  router-id 10.255.255.4
 exit-address-family
!
interface e0/0
 ospfv3 20 ipv6 area 0
interface e0/1
 ospfv3 20 ipv6 area 0
interface vlan 110
 ospfv3 20 ipv6 area 0
interface vlan 120
 ospfv3 20 ipv6 area 0
interface vlan 130
 ospfv3 20 ipv6 area 0
interface loopback0
 ospfv3 20 ipv6 area 0
!
ip sla 12
 icmp-echo 10.255.0.9 source-interface e0/0
 frequency 5
ip sla schedule 12 life forever start-time now
track 12 ip sla 12 reachability
!
! Optional inbound OSPF filtering exercise. Uncomment only when practicing it.
! ip prefix-list FILTER-LAB seq 5 deny 192.0.2.0/24
! ip prefix-list FILTER-LAB seq 10 permit 0.0.0.0/0 le 32
! router ospf 10
!  distribute-list prefix FILTER-LAB in
!
logging host 10.110.30.50
logging trap warnings
ntp server 10.110.30.50
ip radius source-interface loopback0
radius server MGMT1
 address ipv4 10.110.30.50 auth-port 1812 acct-port 1813
 key LabRadius!2026
!
aaa new-model
aaa group server radius MGMT-RADIUS
 server name MGMT1
aaa authentication login default group MGMT-RADIUS local
username localadmin privilege 15 secret PortfolioLocal!2026
!
ip access-list standard MGMT-NMS
 permit 10.110.30.50
 deny any
snmp-server community NARGES-RO ro MGMT-NMS
snmp-server contact NARGES
snmp-server location EVE-NG-PORTFOLIO-LAB
snmp-server host 10.110.30.50 version 2c NARGES-RO config ospf
snmp-server enable traps config
snmp-server enable traps ospf
!
end
