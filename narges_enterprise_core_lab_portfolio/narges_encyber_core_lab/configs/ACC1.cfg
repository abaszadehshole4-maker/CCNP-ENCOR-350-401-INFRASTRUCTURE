hostname ACC1
!
no ip domain-lookup
spanning-tree mode rapid-pvst
!
vlan 110
 name USERS_A
vlan 120
 name USERS_B
vlan 130
 name SERVERS
vlan 999
 name NATIVE
!
interface gi0/1
 description TRUNK-TO-DIST1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 110,120,130,999
 no shutdown
!
interface gi0/2
 description TRUNK-TO-DIST2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 110,120,130,999
 no shutdown
!
interface range gi0/3-4
 description LACP-TO-ACC2
 channel-group 12 mode active
 no shutdown
!
interface port-channel12
 description LACP-TO-ACC2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 110,120,130,999
 no shutdown
!
interface gi0/5
 description MGMT-SW-TRUNK
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 130,999
 no shutdown
!
interface gi0/6
 description PC2-VLAN110
 switchport mode access
 switchport access vlan 110
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface gi0/7
 description PC3-VLAN120
 switchport mode access
 switchport access vlan 120
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface gi0/8
 description PC4-VLAN130
 switchport mode access
 switchport access vlan 130
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
spanning-tree vlan 110,130 root primary
spanning-tree vlan 120 root secondary
!
end
