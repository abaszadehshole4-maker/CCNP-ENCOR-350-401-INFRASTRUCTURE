hostname R2-TRANSIT
ipv6 unicast-routing
!
vrf definition FINANCE
 rd 65010:110
 address-family ipv4
 exit-address-family
 address-family ipv6
 exit-address-family
!
vrf definition ENGINEERING
 rd 65010:120
 address-family ipv4
 exit-address-family
 address-family ipv6
 exit-address-family
!
interface GigabitEthernet0/0
 vrf forwarding FINANCE
 ip address 172.30.10.2 255.255.255.252
 ipv6 address 2001:db8:44:10::2/64
 no shutdown
!
interface GigabitEthernet0/1
 vrf forwarding ENGINEERING
 ip address 172.30.20.2 255.255.255.252
 ipv6 address 2001:db8:44:20::2/64
 no shutdown
!
interface GigabitEthernet0/2
 vrf forwarding FINANCE
 ip address 172.30.30.1 255.255.255.252
 ipv6 address 2001:db8:55:30::1/64
 no shutdown
!
interface GigabitEthernet0/3
 vrf forwarding ENGINEERING
 ip address 172.30.40.1 255.255.255.252
 ipv6 address 2001:db8:55:40::1/64
 no shutdown
!
ip route vrf FINANCE 10.44.110.0 255.255.255.0 172.30.10.1
ip route vrf FINANCE 10.55.110.0 255.255.255.0 172.30.30.2
ipv6 route vrf FINANCE 2001:db8:44:110::/64 2001:db8:44:10::1
ipv6 route vrf FINANCE 2001:db8:55:110::/64 2001:db8:55:30::2
!
ip route vrf ENGINEERING 10.44.120.0 255.255.255.0 172.30.20.1
ip route vrf ENGINEERING 10.55.120.0 255.255.255.0 172.30.40.2
ipv6 route vrf ENGINEERING 2001:db8:44:120::/64 2001:db8:44:20::1
ipv6 route vrf ENGINEERING 2001:db8:55:120::/64 2001:db8:55:40::2
!
enable algorithm-type scrypt secret Narges-CORE-Enable
username admin privilege 15 algorithm-type scrypt secret Narges-Admin-Secret
aaa new-model
aaa authentication login default local
!
line con 0
 login authentication default
!
line vty 0 4
 transport input ssh
 login authentication default
!
end
