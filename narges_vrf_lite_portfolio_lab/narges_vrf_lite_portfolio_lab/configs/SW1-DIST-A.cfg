hostname SW1-DIST-A
!
vlan 110
 name FINANCE
vlan 120
 name ENGINEERING
!
interface GigabitEthernet0/0
 description TRUNK_TO_R1_EDGE
 switchport mode trunk
 switchport trunk allowed vlan 110,120
 no shutdown
!
interface GigabitEthernet0/1
 description FIN_PC1
 switchport mode access
 switchport access vlan 110
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/2
 description ENG_PC1
 switchport mode access
 switchport access vlan 120
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/3 - 4
 description LACP_TO_SW3
 switchport mode trunk
 switchport trunk allowed vlan 110,120
 channel-group 10 mode active
 no shutdown
!
interface Port-channel10
 description LACP_TO_SW3
 switchport mode trunk
 switchport trunk allowed vlan 110,120
 no shutdown
!
enable algorithm-type scrypt secret Narges-CORE-Enable
username admin privilege 15 algorithm-type scrypt secret Narges-Admin-Secret
aaa new-model
aaa authentication login default local
!
line con 0
 login authentication default
!
line vty 0 4
 transport input ssh
 login authentication default
!
end
