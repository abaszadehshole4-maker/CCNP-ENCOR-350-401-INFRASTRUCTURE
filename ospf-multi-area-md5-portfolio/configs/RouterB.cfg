!
hostname RouterB
!
interface Loopback0
 ip address 10.255.20.1 255.255.255.255
!
interface Ethernet0/0
 ip address 10.60.0.2 255.255.255.252
 ip ospf 10 area 0
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 LabAuth-2026
 no shutdown
!
interface Ethernet0/1
 ip address 10.60.140.1 255.255.255.252
 ip ospf 10 area 140
 no shutdown
!
router ospf 10
 router-id 10.255.20.1
!
end
